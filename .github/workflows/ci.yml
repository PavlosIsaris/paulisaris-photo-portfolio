name: CI

on:
    pull_request:
    push:
        branches:
            - main

# A new push to the same PR or branch cancels the run it replaces.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        name: Lint & format
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the source repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # The same steps as pre-commit/action, written out: its latest release (v3.0.1) still
            # uses actions/cache@v4, which runs on the deprecated Node 20 runtime.
            - name: Install pre-commit
              id: pre-commit
              run: |
                  python -m pip install pre-commit
                  echo "python=$(python -VV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

            # Hook environments are virtualenvs, so the key includes the Python build as well as
            # the hook config: a runner image with a new Python must not reuse old environments.
            - name: Cache pre-commit environments
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/pre-commit
                  key: pre-commit-${{ steps.pre-commit.outputs.python }}-${{ hashFiles('.pre-commit-config.yaml') }}

            # Runs every hook in .pre-commit-config.yaml (whitespace, YAML, Prettier, ESLint).
            - name: Run pre-commit hooks
              run: pre-commit run --all-files --show-diff-on-failure --color=always

    # `astro build` does not type-check, so `astro check` runs as its own job.
    typecheck:
        name: Type check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the source repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run astro check
              run: npm run typecheck

    test:
        name: Unit tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the source repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

    # Verifies that the production build succeeds. The output is discarded:
    # DigitalOcean builds and deploys the site itself from the `release` branch.
    build-check:
        name: Build check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the source repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build the Astro site
              run: npm run build

    # Single aggregate check for the main-branch ruleset: green only when every job above
    # succeeded. `always()` makes it report even when a job fails, so a failure blocks the merge
    # instead of leaving the required check pending forever.
    ci:
        name: CI
        needs: [lint, typecheck, test, build-check]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check job results
              env:
                  RESULTS: ${{ toJSON(needs) }}
              # Only `success` counts: `failure`, `cancelled` and `skipped` all block.
              run: |
                  echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
                  echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null || {
                      echo "At least one job did not succeed."
                      exit 1
                  }
